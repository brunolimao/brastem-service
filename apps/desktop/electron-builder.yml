appId: br.com.brastemservice.app
productName: Brastem-Service
copyright: Brastem-Service
# O instalador "um clique" instala na pasta com o nome do pacote; este nome mantém a pasta de sempre (Programs\Brastem-Service).
extraMetadata:
  name: Brastem-Service
directories:
  output: release
  buildResources: recursos
files:
  - dist/**/*
  - package.json
# O servidor (com seus node_modules já recompilados para o Electron) e o front vão fora do asar.
extraResources:
  - from: .stage/server
    to: server
    # As node_modules do servidor entram pelo gancho afterPack (o electron-builder as descarta aqui).
  - from: .stage/client
    to: client
  # Ícone da janela e da barra de tarefas (o do executável vem de win.icon).
  - from: recursos/icon.png
    to: icone.png
asar: true
# Travas gravadas no executável: ninguém consegue rodá-lo como Node (ELECTRON_RUN_AS_NODE), injetar
# opções (NODE_OPTIONS) nem depurá-lo (--inspect), e só carrega o app.asar conferido pela assinatura
# de integridade que o electron-builder grava.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
afterPack: scripts/depois-de-empacotar.cjs
# Os módulos nativos são recompilados em scripts/preparar.mjs, não aqui.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: recursos/icon.png
nsis:
  # Sem espaços: é o mesmo nome que o latest.yml aponta e que vai para as Releases.
  artifactName: ${productName}-Setup-${version}.${ext}
  # "Um clique": instala direto, sem assistente, mas mostra uma janela de progresso (também nas atualizações).
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Brastem-Service
  deleteAppDataOnUninstall: false
  language: "1046"
# Auto-update: o app instalado consulta as Releases públicas deste repositório.
publish:
  provider: github
  owner: brunolimao
  repo: brastem-service
  # Publica direto (sem rascunho): rascunhos são invisíveis para o auto-update.
  releaseType: release
