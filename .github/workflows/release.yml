name: Release

# Lançar uma versão (publica o instalador e libera a atualização automática):
#   git tag v2.0.1 && git push origin v2.0.1
# Execução manual (aba Actions → Release → Run workflow): só gera o instalador e o guarda como
# arquivo de teste por 3 dias, sem publicar nada.
#
# Segurança: o que vai para as Releases chega a todos os clientes pelo auto-update. Por isso:
# - o build (que roda o `pnpm install` e os testes, ou seja, código de terceiros) só tem permissão de
#   leitura e não guarda o token no disco;
# - só o job "publicar", que não roda nada do projeto, pode escrever nas Releases;
# - as actions são fixadas por SHA (uma tag pode ser movida para outro código).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Duas tags ao mesmo tempo não publicam juntas (a segunda espera).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A versão vem da tag (v2.0.1 -> 2.0.1); o auto-update compara por ela, então ela precisa ser
      # válida e maior que a última publicada (senão os clientes nunca a recebem).
      - name: Conferir a versão
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "versao=0.0.0-teste.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSAO="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag $GITHUB_REF_NAME não é uma versão (use v1.2.3)."
            exit 1
          fi
          ULTIMA=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          MAIOR=$(printf '%s\n%s\n' "${ULTIMA#v}" "$VERSAO" | sort -V | tail -n 1)
          if [ "$VERSAO" = "${ULTIMA#v}" ] || [ "$MAIOR" != "$VERSAO" ]; then
            echo "::error::$VERSAO não é maior que a última versão publicada (${ULTIMA#v})."
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Não publica uma versão que não passa nas verificações.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Gerar o instalador
        shell: bash
        working-directory: apps/desktop
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          pnpm preparar
          pnpm exec electron-builder --win --publish never -c.extraMetadata.version="$VERSAO"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 3

  publicar:
    if: github.ref_type == 'tag'
    needs: instalador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instalador
          path: instalador

      # Cria como rascunho com todos os arquivos e só então publica: a Release nunca fica visível sem o
      # latest.yml (o que quebraria a checagem de atualização de todos os clientes).
      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.instalador.outputs.versao }}
        run: |
          gh release create "$GITHUB_REF_NAME" instalador/* \
            --repo "$GITHUB_REPOSITORY" --title "$VERSAO" --generate-notes --verify-tag --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
