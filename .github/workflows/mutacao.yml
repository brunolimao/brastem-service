name: Testes de mutação

# Toda segunda de madrugada (e à mão em "Run workflow"): o Stryker altera o código de propósito e mostra
# o que nenhum teste percebe (R-TST-02). Demora (de dezenas de minutos a horas), por isso fica fora do CI
# de cada push. Não reprova: o resultado é o relatório, baixado em Artifacts.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutacao
  cancel-in-progress: true

jobs:
  mutacao:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        pacote: [server, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brastem/shared build
      - run: pnpm --filter @brastem/${{ matrix.pacote }} mutacao
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacao-${{ matrix.pacote }}
          path: apps/${{ matrix.pacote }}/reports/mutacao/
          if-no-files-found: ignore
